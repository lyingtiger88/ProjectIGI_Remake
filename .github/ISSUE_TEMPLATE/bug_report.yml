name: Bug report
description: Report a reproducible crash, build error, or gameplay bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please include enough information to reproduce the issue.
  - type: input
    id: engine
    attributes:
      label: Unreal Engine version
      placeholder: "5.8"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit / branch
      placeholder: "main / commit SHA"
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Press...
        3. Crash occurs...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / call stack
      render: shell
  - type: dropdown
    id: clean
    attributes:
      label: Did you try a clean rebuild?
      options:
        - "Yes"
        - "No"
