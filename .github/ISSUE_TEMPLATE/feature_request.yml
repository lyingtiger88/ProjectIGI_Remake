name: Feature request
description: Suggest a gameplay, architecture, tooling, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What problem or gameplay need should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Locomotion
        - Shooting
        - Melee / CQC
        - AI / Stealth
        - Camera / Input
        - Tools / Build
        - Other
